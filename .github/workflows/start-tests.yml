name: Schedule Platform Integration Tests

on:
  schedule:
    - cron: '0 13 * * 0'  # Run every Sunday at 1:00 PM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  schedule-tests:
    runs-on: ubuntu-latest
    
    permissions:
      actions: write  # Required to trigger other workflows
      contents: read
    
    # The branches are STAGGERED, not fired together.
    #
    # Each branch's run opens with a single `resolve-dependencies` job that pulls
    # the Metalama artifacts (~360 MB) from the self-hosted TeamCity over a
    # constrained uplink. Two branches seeding at the same instant compete for that
    # link, and on 2026-08-16 that is exactly what broke both runs at once: one
    # branch's seeding job was starved until its connection dropped, and since
    # `build` needs that job, its entire matrix was skipped.
    #
    # Once seeded, the matrix cells restore from the Actions cache and never touch
    # the uplink, so the contention window lasts only as long as the seeding job --
    # a minute or two on a free link. The delay below is generous by comparison.
    #
    # Add a new branch with a delay one step further out. Do not give two branches
    # the same delay.
    strategy:
      matrix:
        include:
          - branch: 'develop/2026.0'
            delay-minutes: 0
          - branch: 'develop/2026.1'
            delay-minutes: 20
          - branch: 'develop/2027.0'
            delay-minutes: 40

    steps:
    - name: Wait ${{ matrix.delay-minutes }} minute(s) before triggering
      if: matrix.delay-minutes > 0
      run: |
        echo "Staggering the dispatch of ${{ matrix.branch }} by ${{ matrix.delay-minutes }} minute(s)"
        echo "so that its dependency seeding does not compete with the other branch."
        sleep $(( ${{ matrix.delay-minutes }} * 60 ))

    - name: Trigger Platform Integration Tests on ${{ matrix.branch }}
      uses: actions/github-script@v7
      with:
        script: |
          const branch = '${{ matrix.branch }}';
          
          console.log(`Triggering Platform Integration Tests on branch: ${branch}`);
          
          try {
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              ref: branch,
              inputs: {}
            });
            
            console.log(`✅ Successfully triggered workflow on ${branch}`);
            console.log(`Response status: ${result.status}`);
            
          } catch (error) {
            console.error(`❌ Failed to trigger workflow on ${branch}:`, error.message);
            
            if (error.status === 422) {
              console.error(`This might be because:`);
              console.error(`1. Branch '${branch}' does not exist`);
              console.error(`2. The test.yml workflow does not exist on branch '${branch}'`);
              console.error(`3. The test.yml workflow does not have workflow_dispatch trigger`);
            }
            
            throw error;
          }
      
    - name: Log completion
      run: |
        echo "Scheduled test run completed for branch: ${{ matrix.branch }}"
        echo "Check the Actions tab for the triggered workflow run"