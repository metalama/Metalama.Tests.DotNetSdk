name: Platform Integration Tests

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-vs2026-arm
          - macos-15
      dotnet-version:
        description: '.NET SDK version (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '8.0'
          - '9.0'
          - '10.0'
          - '11.0'
      project-type:
        description: 'Project type (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - console
          - maui
          - maui-blazor
          - mvc
          - razor
          - blazor
          - blazorwasm
          - winforms
          - wpf
      sdk-source:
        description: 'SDK source (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - setup-dotnet
          - setup-dotnet-x86
          - apt
      build-tool:
        description: 'Build tool (or "all" for full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dotnet
          - msbuild-x64
          - msbuild-x86
          - msbuild-arm64
      metalama-branch:
        description: 'Metalama branch to take the artifacts from (default: this branch, or its parent develop branch when this is a topic branch)'
        required: false
        default: ''
        type: string

env:
  SUMMARY_ISSUE_NUMBER: 7  # Issue number for this branch

  # ═══════════════════════════════════════════════════════════════════════════
  # macOS MAUI version pins — UPDATE PERIODICALLY. See CLAUDE.md for the procedure.
  # ═══════════════════════════════════════════════════════════════════════════
  # On macOS the maui / maui-blazor jobs build the iOS and Mac Catalyst target
  # frameworks. Those builds fail unless the active Xcode matches the Xcode the
  # installed .NET iOS/MacCatalyst workload was built for:
  #   error : This version of .NET for iOS (NN.N.xxxxx) requires Xcode NN.N.
  #
  # Two moving parts make "just use the latest" impossible:
  #   1. The GitHub macos-15 runner image lags Apple's Xcode releases by weeks,
  #      so the Xcode the latest workload wants is often not installed at all —
  #      and maxim-lobanov/setup-xcode can only SELECT an Xcode already on the
  #      image, it cannot download one. (We chased a hardcoded Xcode pin ~10
  #      times; it always broke again when the workload's floor moved past the
  #      image.)
  #   2. Microsoft's iOS/MacCatalyst workloads lag the .NET SDK by a feature
  #      band, so the very latest SDK has no matching iOS workload at all.
  #
  # So for these jobs we deliberately do NOT track "latest". Each .NET version is
  # pinned to the newest dotnet/macios release whose required Xcode is present on
  # the runner image. Each pin is one matched set: the SDK version (which equals
  # the workload-set version) plus the Xcode that release requires. Sources:
  #   - workload set + required Xcode: https://github.com/dotnet/macios/releases
  #   - Xcode versions on the runner:  actions/runner-images macos-15 readme
  # .NET 8 needs no SDK pin: its iOS workload is frozen at Xcode 16.0 (always on
  # the image), so for .NET 8 only the Xcode selection matters.
  MACOS_MAUI_SDK_9_0:   '9.0.313'     # dotnet-9.0.1xx-xcode26.2.9008   -> Xcode 26.3
  MACOS_MAUI_SDK_10_0:  '10.0.202'    # dotnet-10.0.1xx-xcode26.2-10233 -> Xcode 26.3
  # .NET 11 is in preview and lags hardest: preview 4 and later require Xcode
  # 26.4+, which in turn requires macOS 26.2 -- the macos-15 image tops out at
  # Xcode 26.3. dotnet-11.0.1xx-preview3 is therefore the newest .NET 11 macios
  # release this runner can host. It will move up only when the OS axis gains a
  # macos-26 runner, not when a newer preview ships.
  MACOS_MAUI_SDK_11_0:  '11.0.100-preview.3.26207.106'   # dotnet-11.0.1xx-preview3-11588 -> Xcode 26.3
  MACOS_MAUI_XCODE_8_0:  '16.0'       # dotnet-8.0.1xx-xcode16.0-8319
  MACOS_MAUI_XCODE_9_0:  '26.3'
  MACOS_MAUI_XCODE_10_0: '26.3'
  MACOS_MAUI_XCODE_11_0: '26.3'
  # The workload SET version is normally the SDK version, which is why the pins
  # above serve as both. The .NET 11 previews break that: SDK
  # 11.0.100-preview.3.26207.106 ships alongside workload set
  # 11.0.100-preview.3.26214.1. So this band carries an explicit set pin.
  MACOS_MAUI_WORKLOADSET_11_0: '11.0.100-preview.3.26214.1'
  # ═══════════════════════════════════════════════════════════════════════════

  # Workflow-level so the dependency-seeding job can key its cache on it too.
  CacheKeyPrefix: '2026.1-5' # Increase this value to invalidate the cache.

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # Dependency seeding — keeps the TeamCity artifacts off the company uplink.
  # ═══════════════════════════════════════════════════════════════════════════
  # The Metalama artifacts are served from a self-hosted TeamCity on a LAN with
  # limited upstream bandwidth. Left alone, every matrix job downloads them, so a
  # full run pulls the same payload a couple of hundred times over that link.
  #
  # Instead, ONE job downloads them and stores them in the GitHub Actions cache;
  # every matrix job restores from there.
  #
  # A single job suffices for every platform because the artifacts are plain NuGet
  # packages -- no symlinks, no executable bits, nothing platform-specific -- so the
  # cache key deliberately carries no runner.os/runner.arch.
  #
  # Sharing one entry across operating systems has two requirements, and BOTH are
  # needed. Getting either wrong fails silently, with the job downloading from
  # TeamCity while still reporting success:
  #
  #   a) `enableCrossOsArchive: true`. Windows refuses cache entries written on
  #      another platform without it (actions/cache defaults it to false).
  #   b) The cached path must be WORKSPACE-RELATIVE (`.deps-cache`). actions/cache
  #      cannot translate an absolute path such as ~/.build-artifacts across
  #      operating systems -- with enableCrossOsArchive it re-roots the archive at
  #      GITHUB_WORKSPACE, so a Linux-written entry unpacked on Windows landed in
  #      D:\a\<repo> instead of C:\Users\runneradmin and was silently ignored.
  #      Hence the staging directory plus the copy steps around it.
  #
  # Two properties of PostSharp.Engineering make this work with no changes on its side:
  #
  #   1. DownloadBuild writes a `.completed` sentinel next to the artifacts and
  #      skips the download outright when it already exists, so a restored tree is
  #      reused verbatim.
  #   2. The absolute paths baked into nuget.config and eng/Versions.*.g.props do
  #      not need to survive the cache: every job regenerates them locally in
  #      `Build.ps1 prepare`. Only the artifacts themselves must be restored.
  #
  # Cache lifetime is GitHub's own: entries unused for 7 days are evicted, and the
  # repository-wide 10 GB budget is reclaimed least-recently-used. There is no
  # per-entry TTL to set -- one week is what the platform already does.
  # ═══════════════════════════════════════════════════════════════════════════

  # Resolve "latest Metalama build on this branch" ONCE, and publish the resolved
  # build number to every downstream job. Beyond making the cache key stable
  # across runs, this removes a real hazard: each job used to resolve the branch
  # independently, so a Metalama build completing mid-run would silently split the
  # matrix across two different Metalama versions.
  resolve-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_POSTSHARP_OWNED: true
      TEAMCITY_CLOUD_TOKEN: ${{ secrets.TEAMCITY_CLOUD_TOKEN }}
      ConsoleAnsi: 'No'
    outputs:
      build-number: ${{ steps.resolve.outputs.build-number }}
      build-type-id: ${{ steps.resolve.outputs.build-type-id }}
      premium-build-number: ${{ steps.resolve.outputs.premium-build-number }}
      premium-build-type-id: ${{ steps.resolve.outputs.premium-build-type-id }}
      deps-id: ${{ steps.resolve.outputs.deps-id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET For Engineering
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.3xx # Keep in sync with eng/src/global.json.

    # PostSharp.Engineering derives the artifact cache location from USERPROFILE
    # and falls back to Path.GetTempPath() when it is unset -- which on Linux and
    # macOS it always is. On macOS that fallback is a volatile per-session
    # /var/folders/... path, which cannot be cached. Pointing USERPROFILE at HOME
    # gives the same $HOME/.build-artifacts location on every platform.
    - name: Pin the artifact cache location
      if: runner.os != 'Windows'
      run: echo "USERPROFILE=$HOME" >> $GITHUB_ENV

    # This job cannot know the build number before resolving it, so it cannot ask
    # for an exact cache key. Instead take the most recent entry via restore-keys
    # (the exact key below is deliberately one that never hits).
    #
    # This is safe regardless of what it restores, because the build number is
    # part of the artifact directory path and `.completed` is per build number:
    # if the branch still points at the restored build, the fetch below finds the
    # sentinel and downloads nothing; if a newer build exists, its directory is
    # simply absent and only that one is downloaded. So an unchanged Metalama
    # means a run that touches the company uplink not at all.
    - name: Restore previously seeded dependencies
      uses: actions/cache/restore@v4
      with:
        # The cached path MUST be workspace-relative. actions/cache cannot translate
        # an absolute path such as ~/.build-artifacts across operating systems: with
        # enableCrossOsArchive it re-roots the archive at GITHUB_WORKSPACE, so a
        # Linux-written entry unpacked on Windows landed in the workspace instead of
        # C:\Users\runneradmin and was silently ignored. We therefore cache a staging
        # directory inside the workspace and copy to/from the real artifact location.
        path: .deps-cache
        enableCrossOsArchive: true
        key: deps-${{ env.CacheKeyPrefix }}-unresolved
        restore-keys: |
          deps-${{ env.CacheKeyPrefix }}-

    - name: Unstage dependencies into the artifact location
      shell: pwsh
      run: |
        if (Test-Path .deps-cache) {
          $target = Join-Path $env:USERPROFILE '.build-artifacts'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path '.deps-cache/*' -Destination $target -Recurse -Force
          Write-Host "Staged previously cached dependencies into $target"
        } else {
          Write-Host 'No previously cached dependencies.'
        }

    # Which Metalama branch to take the artifacts from.
    #
    # TeamCity resolves "the latest Metalama build on branch X", and X used to be
    # this repository's own branch name. That only works for branches that exist
    # in BOTH repositories -- the develop/* and release/* lines. A topic branch
    # here has no counterpart in Metalama, so the lookup failed with
    #
    #   Cannot get the last build for build type '...', branch '...': No build available.
    #
    # and, since `build` needs this job, took the whole run with it (32359427586).
    #
    # A topic branch therefore falls back to the develop branch it forks from,
    # which its own name already encodes: topic/2026.1/net11 -> develop/2026.1.
    # The `metalama-branch` dispatch input overrides this, for the case where a
    # topic branch here DOES have a matching Metalama branch to test against.
    - name: Resolve the Metalama branch
      id: metalama-branch
      shell: pwsh
      run: |
        $branch = '${{ inputs.metalama-branch }}'
        $ref = '${{ github.ref_name }}'
        if ( $branch ) {
          Write-Host "Using the Metalama branch given on dispatch."
        } elseif ( $ref -match '^topic/([^/]+)/' ) {
          $branch = "develop/$($Matches[1])"
          Write-Host "'$ref' is a topic branch with no Metalama counterpart; using its parent develop branch."
        } else {
          $branch = $ref
        }
        Write-Host "::notice::Metalama dependency branch: $branch"
        "branch=$branch" >> $env:GITHUB_OUTPUT

    # `dependencies set` already resolves the branch and downloads the artifacts
    # (Metalama and, transitively, Metalama.Compiler) -- a separate
    # `dependencies fetch` would be redundant.
    #
    # RETRIED, because this single step gates the entire run: `build` needs this
    # job, so one dropped connection here skips every matrix cell. That is not
    # hypothetical -- run 31949158055 died exactly this way, 13 minutes into a
    # ~360 MB download, with "The response ended prematurely". The artifacts come
    # from a self-hosted TeamCity on a constrained uplink, and PostSharp.Engineering
    # downloads them on an HttpClient with the default 100 s per-request timeout,
    # so a large package under any contention is a coin flip rather than a certainty.
    #
    # A retry is safe and needs no cleanup: when the `.completed` sentinel is
    # absent, DownloadBuild deletes the whole restore directory before downloading
    # again (DependenciesHelper.cs:619), so a partial tree from a failed attempt is
    # discarded rather than mistaken for a good one. Conversely, whatever DID
    # complete on an earlier attempt keeps its sentinel and is skipped, so retries
    # get cheaper rather than starting from zero.
    - name: Configure the dependency to Metalama
      shell: pwsh
      run: |
        $attempts = 3
        for ($i = 1; $i -le $attempts; $i++) {
          Write-Host "Dependency download attempt $i of $attempts."
          ./Build.ps1 dependencies set BuildServer Metalama Metalama.Premium --branch ${{ steps.metalama-branch.outputs.branch }} --nologo --no-progress
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($i -lt $attempts) {
            Write-Host "::warning::Attempt $i failed with exit code $LASTEXITCODE. Retrying in 60 s."
            Start-Sleep -Seconds 60
          }
        }
        Write-Host "::error::Could not download the Metalama artifacts after $attempts attempts."
        exit 1

    # Read back what the download actually resolved. The generated file is
    # eng/Versions.<Config>[.ci].g.props and carries one LocalDependencySource per
    # dependency, each with BuildNumber and CiBuildTypeId.
    - name: Read resolved build numbers
      id: resolve
      shell: pwsh
      run: |
        $file = Get-ChildItem -Path eng -Filter 'Versions.*g.props' |
          Where-Object { $_.Name -notlike 'Versions.g.props' } |
          Select-Object -First 1
        if (-not $file) { Write-Error 'No generated eng/Versions.*.g.props found.'; exit 1 }
        Write-Host "Reading $($file.FullName)"
        $xml = [xml](Get-Content $file.FullName -Raw)
        $sources = $xml.Project.ItemGroup.LocalDependencySource |
          Where-Object { $_.BuildNumber }
        if (-not $sources) { Write-Error 'No build-server dependency was resolved.'; exit 1 }
        foreach ($s in $sources) { Write-Host "  $($s.Include) #$($s.BuildNumber) ($($s.CiBuildTypeId))" }
        $metalama = $sources | Where-Object { $_.Include -eq 'Metalama' } | Select-Object -First 1
        if (-not $metalama) { Write-Error 'The Metalama dependency was not resolved.'; exit 1 }
        # Metalama.Premium carries the Extensions.Architecture / .Validation / .CodeFixes and
        # Caching.Backends.* packages that the package tests exercise. It has always been an
        # explicit dependency of this product; it simply had no source configured.
        $premium = $sources | Where-Object { $_.Include -eq 'Metalama.Premium' } | Select-Object -First 1
        if (-not $premium) { Write-Error 'The Metalama.Premium dependency was not resolved.'; exit 1 }
        # Identity of the whole dependency set, so a change in ANY resolved build
        # (including transitive ones such as Metalama.Compiler) busts the cache.
        $depsId = (($sources | Sort-Object Include |
          ForEach-Object { "$($_.Include)-$($_.CiBuildTypeId)-$($_.BuildNumber)" }) -join '_')
        "build-number=$($metalama.BuildNumber)" >> $env:GITHUB_OUTPUT
        "build-type-id=$($metalama.CiBuildTypeId)" >> $env:GITHUB_OUTPUT
        "premium-build-number=$($premium.BuildNumber)" >> $env:GITHUB_OUTPUT
        "premium-build-type-id=$($premium.CiBuildTypeId)" >> $env:GITHUB_OUTPUT
        "deps-id=$depsId" >> $env:GITHUB_OUTPUT
        Write-Host "deps-id=$depsId"

    - name: Stage dependencies for caching
      shell: pwsh
      run: |
        $source = Join-Path $env:USERPROFILE '.build-artifacts'
        New-Item -ItemType Directory -Force -Path .deps-cache | Out-Null
        Copy-Item -Path "$source/*" -Destination .deps-cache -Recurse -Force
        Write-Host "Staged $source for caching"

    # One entry, consumed by every matrix job on every platform.
    - name: Save dependencies to cache
      uses: actions/cache/save@v4
      # On a warm run the entry for this exact dependency set already exists and
      # the save is a no-op that reports failure. That is expected, not an error.
      continue-on-error: true
      with:
        # The cached path MUST be workspace-relative. actions/cache cannot translate
        # an absolute path such as ~/.build-artifacts across operating systems: with
        # enableCrossOsArchive it re-roots the archive at GITHUB_WORKSPACE, so a
        # Linux-written entry unpacked on Windows landed in the workspace instead of
        # C:\Users\runneradmin and was silently ignored. We therefore cache a staging
        # directory inside the workspace and copy to/from the real artifact location.
        path: .deps-cache
        enableCrossOsArchive: true
        key: deps-${{ env.CacheKeyPrefix }}-${{ steps.resolve.outputs.deps-id }}

  build:
    needs: resolve-dependencies

    strategy:
      matrix:
        # When input is 'all' or empty, use full array; otherwise wrap single value in array
        # Find and replace macos-15 to macos-latest as soon as macos-15 get out of preview.
        os: ${{ inputs.os != 'all' && inputs.os != '' && fromJson(format('["{0}"]', inputs.os)) || fromJson('["ubuntu-24.04", "ubuntu-22.04", "ubuntu-24.04-arm", "windows-latest", "windows-11-vs2026-arm", "macos-15"]') }}
        dotnet-version: ${{ inputs.dotnet-version != 'all' && inputs.dotnet-version != '' && fromJson(format('["{0}"]', inputs.dotnet-version)) || fromJson('["8.0", "9.0", "10.0", "11.0"]') }}
        project-type: ${{ inputs.project-type != 'all' && inputs.project-type != '' && fromJson(format('["{0}"]', inputs.project-type)) || fromJson('["console", "maui", "maui-blazor", "mvc", "razor", "blazor", "blazorwasm", "winforms", "wpf"]') }}  # dotnet new list
        sdk-source: ${{ inputs.sdk-source != 'all' && inputs.sdk-source != '' && fromJson(format('["{0}"]', inputs.sdk-source)) || fromJson('["setup-dotnet", "setup-dotnet-x86", "apt"]') }}
        # Which tool drives the build: the `dotnet` CLI, or the .NET Framework
        # MSBuild.exe from Visual Studio (Windows only). The msbuild-* values pick
        # the MSBuild HOST architecture, which is independent of the SDK
        # architecture chosen by sdk-source. Note that Bin\MSBuild.exe is the
        # 32-bit host and Bin\amd64\MSBuild.exe the 64-bit one, so msbuild-x64
        # must be requested explicitly -- see the Set up MSBuild step.
        # Keep this axis LAST: the generated job name lists matrix values in
        # definition order, and the summary job's regex depends on that order.
        build-tool: ${{ inputs.build-tool != 'all' && inputs.build-tool != '' && fromJson(format('["{0}"]', inputs.build-tool)) || fromJson('["dotnet", "msbuild-x64", "msbuild-x86", "msbuild-arm64"]') }}
        exclude:
          # WinForms and WPF are only available on Windows
          - project-type: winforms # N/A
            os: ubuntu-24.04
          - project-type: winforms # N/A
            os: ubuntu-22.04
          - project-type: winforms # N/A
            os: ubuntu-24.04-arm
          - project-type: winforms # N/A
            os: macos-15
          - project-type: wpf # N/A
            os: ubuntu-24.04
          - project-type: wpf # N/A
            os: ubuntu-22.04
          - project-type: wpf # N/A
            os: ubuntu-24.04-arm
          - project-type: wpf # N/A
            os: macos-15

          # MAUI is not available on ARM because Android SDK cannot be installed
          - project-type: maui
            os:  ubuntu-24.04-arm
          - project-type: maui-blazor
            os:  ubuntu-24.04-arm
          - project-type: maui
            os:  windows-11-vs2026-arm
          - project-type: maui-blazor
            os:  windows-11-vs2026-arm

          # apt SDK source only for Ubuntu
          - sdk-source: apt
            os: windows-latest
          - sdk-source: apt
            os: windows-11-vs2026-arm
          - sdk-source: apt
            os: macos-15

          # The x86 SDK is Windows-only, and only makes sense on an x64 host:
          # windows-11-vs2026-arm has no x86 .NET SDK, and Linux/macOS ship none at all.
          - sdk-source: setup-dotnet-x86
            os: ubuntu-24.04
          - sdk-source: setup-dotnet-x86
            os: ubuntu-22.04
          - sdk-source: setup-dotnet-x86
            os: ubuntu-24.04-arm
          - sdk-source: setup-dotnet-x86
            os: windows-11-vs2026-arm
          - sdk-source: setup-dotnet-x86
            os: macos-15

          # MAUI workloads are not published for win-x86: `dotnet workload install
          # maui` fails outright with "Workload ID maui isn't supported on this
          # platform". MAUI stays covered by every other Windows combination.
          - sdk-source: setup-dotnet-x86
            project-type: maui
          - sdk-source: setup-dotnet-x86
            project-type: maui-blazor

          # ── MSBuild.exe axis ─────────────────────────────────────────────────
          # MSBuild.exe ships with Visual Studio, which exists only on the Windows
          # runner images (windows-latest and windows-11-vs2026-arm both carry VS 2022
          # Enterprise). There is no MSBuild.exe on Linux or macOS.
          - build-tool: msbuild-x64
            os: ubuntu-24.04
          - build-tool: msbuild-x64
            os: ubuntu-22.04
          - build-tool: msbuild-x64
            os: ubuntu-24.04-arm
          - build-tool: msbuild-x64
            os: macos-15
          - build-tool: msbuild-x86
            os: ubuntu-24.04
          - build-tool: msbuild-x86
            os: ubuntu-22.04
          - build-tool: msbuild-x86
            os: ubuntu-24.04-arm
          - build-tool: msbuild-x86
            os: macos-15
          - build-tool: msbuild-arm64
            os: ubuntu-24.04
          - build-tool: msbuild-arm64
            os: ubuntu-22.04
          - build-tool: msbuild-arm64
            os: ubuntu-24.04-arm
          - build-tool: msbuild-arm64
            os: macos-15

          # Each MSBuild host architecture belongs to the runner that can execute
          # it natively: x64/x86 on the x64 runner, arm64 on the arm64 runner.
          - build-tool: msbuild-arm64
            os: windows-latest
          - build-tool: msbuild-x64
            os: windows-11-vs2026-arm
          - build-tool: msbuild-x86
            os: windows-11-vs2026-arm

          # Keep the build-tool and sdk-source axes from multiplying out: MSBuild
          # is exercised against the normal x64 SDK only, and the x86 SDK is
          # exercised through `dotnet build` only. Dropping these two excludes
          # would add the (x86 SDK x MSBuild) cells if that ever becomes interesting.
          - sdk-source: setup-dotnet-x86
            build-tool: msbuild-x64
          - sdk-source: setup-dotnet-x86
            build-tool: msbuild-x86

          # There is no .NET 11 apt package. The dotnet/backports PPA publishes
          # dotnet6..dotnet10 only; Canonical does not package .NET previews, and
          # will not until .NET 11 reaches GA. `apt-get install dotnet11` fails
          # outright, so the whole apt axis is excluded for this band.
          - dotnet-version: '11.0'
            sdk-source: apt

          # ubuntu-22.04 is only used for .NET 10.0 apt (dotnet10 package not available for 24.04)
          - os: ubuntu-22.04
            sdk-source: setup-dotnet
          - os: ubuntu-22.04
            dotnet-version: '8.0'
          - os: ubuntu-22.04
            dotnet-version: '9.0'
          - os: ubuntu-22.04
            dotnet-version: '11.0'

          # .NET 10.0 apt not available on ubuntu 24.04 - use ubuntu-22.04 instead
          - os: ubuntu-24.04
            dotnet-version: '10.0'
            sdk-source: apt
          - os: ubuntu-24.04-arm
            dotnet-version: '10.0'
            sdk-source: apt

          # .NET 8 MAUI is not testable on the apt SDK: the Canonical-packaged
          # .NET 8 SDK does not recognize the maui-android workload (`dotnet
          # workload install maui-android` fails immediately with "Workload ID
          # maui-android is not recognized"). .NET 9/10 apt SDKs do support it.
          # .NET 8 MAUI is still covered by the setup-dotnet jobs on every OS.
          - dotnet-version: '8.0'
            project-type: maui
            sdk-source: apt
          - dotnet-version: '8.0'
            project-type: maui-blazor
            sdk-source: apt

      fail-fast: false # Don't stop other jobs if one fails.
      max-parallel: 8 # Give a chance to stop early when we run manually.

    timeout-minutes: 60

    runs-on: ${{ matrix.os }}  # For a list of available runner types, refer to
                               # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_POSTSHARP_OWNED: true
      TEAMCITY_CLOUD_TOKEN: ${{ secrets.TEAMCITY_CLOUD_TOKEN }}
      ConsoleAnsi: ${{ (matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-15') && 'No' || 'Detect' }} # https://github.com/orgs/community/discussions/136868
      MetalamaAssemblyLocatorHooksDirectory: '../..'
      # CacheKeyPrefix is defined at workflow level so the seeding job shares it.

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # Must agree with the path the dependency cache is restored to (~/.build-artifacts).
    # PostSharp.Engineering reads USERPROFILE, which does not exist on Unix, and
    # falls back to a temp path that is not stable on macOS. See resolve-dependencies.
    - name: Pin the artifact cache location
      if: runner.os != 'Windows'
      run: echo "USERPROFILE=$HOME" >> $GITHUB_ENV

    # Determine the latest .NET SDK version from GitHub API because the dotnet-install.ps1 script does not
    # always resolve to the latest version, e.g. when the "full version" has suffix, like in `10.0.100-rc.1.25451.107`.
    - name: Get exact .NET SDK version
      id: get-exact-version
      if: matrix.sdk-source != 'apt'
      shell: pwsh
      run: |
        # macOS maui/maui-blazor jobs build the iOS + Mac Catalyst TFMs and so need
        # an SDK + workload set whose required Xcode is installed on the runner. The
        # latest SDK does NOT qualify (see the macOS MAUI version pins in the env
        # block above and CLAUDE.md), so for those jobs we use the pinned version.
        # Every other job keeps tracking the latest SDK.
        $isMacMaui = ('${{ matrix.os }}' -eq 'macos-15') -and ('${{ matrix.project-type }}' -eq 'maui' -or '${{ matrix.project-type }}' -eq 'maui-blazor')
        $pin = @{
          '9.0'  = '${{ env.MACOS_MAUI_SDK_9_0 }}'
          '10.0' = '${{ env.MACOS_MAUI_SDK_10_0 }}'
          '11.0' = '${{ env.MACOS_MAUI_SDK_11_0 }}'
        }['${{ matrix.dotnet-version }}']
        if ($isMacMaui -and $pin) {
          $exactVersion = $pin
          Write-Host "macOS MAUI job: pinned .NET ${{ matrix.dotnet-version }} to $exactVersion (Xcode-compatible workload set)."
        } else {
          $exactVersion = .\GetLatestVersion.ps1 -VersionPrefix "${{ matrix.dotnet-version }}"
          Write-Host "Resolved ${{ matrix.dotnet-version }} to $exactVersion"
        }
        "exact-version=$exactVersion" >> $env:GITHUB_OUTPUT
        # Update job name to include exact version for summary parsing
        echo "JOB_EXACT_VERSION=$exactVersion" >> $env:GITHUB_ENV

    # Install .NET SDK via apt package manager (Ubuntu only)
    # Note: We install before cache check because we need the version for the cache key
    # The backports PPA uses package names like "dotnet8", "dotnet9", "dotnet10"
    # See: https://launchpad.net/~dotnet/+archive/ubuntu/backports
    - name: Install .NET SDK via apt
      id: setup-dotnet-apt
      if: matrix.sdk-source == 'apt'
      run: |
        sudo add-apt-repository ppa:dotnet/backports -y
        sudo apt-get update
        # Backports PPA uses "dotnetX" naming (e.g., dotnet8, dotnet9, dotnet10)
        DOTNET_MAJOR=$(echo "${{ matrix.dotnet-version }}" | cut -d. -f1)
        sudo apt-get install -y dotnet${DOTNET_MAJOR}
        # Resolve the SDK version from the folders apt actually created under
        # <dotnet-root>/sdk. A folder name there IS an installed SDK, so the
        # version we pin can never be one that is missing from disk, and it
        # adapts to whatever apt installs.
        #
        # Do NOT derive the version from apt/dpkg metadata or `dotnet --version`:
        # the Ubuntu dotnet/backports PPA versions its packages on a scheme of
        # its own that does not match the real .NET SDK version. An earlier blind
        # `N -> N-1` patch correction tried to compensate for that gap, but the
        # gap is not a fixed offset, so it ended up pinning versions that were
        # never installed (e.g. apt installed 10.0.107, the correction pinned the
        # non-existent 10.0.106).
        APT_DOTNET_DIR=$(dirname $(readlink -f $(which dotnet)))
        echo "APT_DOTNET_DIR=$APT_DOTNET_DIR" >> $GITHUB_ENV
        EXACT_VERSION=$(ls "$APT_DOTNET_DIR/sdk" | grep "^${DOTNET_MAJOR}\." | sort -V | tail -1)
        if [ -z "$EXACT_VERSION" ]; then
          echo "::error::apt installed no .NET ${DOTNET_MAJOR} SDK under $APT_DOTNET_DIR/sdk"
          ls -la "$APT_DOTNET_DIR/sdk" || true
          exit 1
        fi
        echo "dotnet-version=$EXACT_VERSION" >> $GITHUB_OUTPUT
        echo "Installed .NET SDK version: $EXACT_VERSION"
        dotnet --info

    # Get unified SDK version from either source
    - name: Get installed SDK version
      id: sdk-version
      shell: bash
      run: |
        if [ "${{ matrix.sdk-source }}" == "apt" ]; then
          VERSION="${{ steps.setup-dotnet-apt.outputs.dotnet-version }}"
        else
          VERSION="${{ steps.get-exact-version.outputs.exact-version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using SDK version: $VERSION"

    - name: "Exact Version: ${{ steps.sdk-version.outputs.version }}${{ matrix.sdk-source == 'apt' && ' (apt)' || '' }}"
      run: echo "Using .NET version ${{ steps.sdk-version.outputs.version }}"

    - name: Restore build cache
      id: cache-build
      uses: actions/cache@v4
      with:
        path: |
          ./.build-cache
        key: build-${{ env.CacheKeyPrefix }}-${{ matrix.os }}-${{ matrix.sdk-source }}-${{ steps.sdk-version.outputs.version }}-${{ matrix.project-type }}-${{ matrix.build-tool }}

    # global.json must be present for setup-dotnet to work.
    - name: Create temporary global.json
      id: create-temp-global-json
      if: matrix.sdk-source != 'apt' && steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $globalJson = @{
          sdk = @{
            version = "${{ steps.get-exact-version.outputs.exact-version }}"
          }
        }
        $globalJson | ConvertTo-Json -Depth 3 | Set-Content -Path "./global.json"

    - name: Install .NET For The Test
      uses: actions/setup-dotnet@v5
      id: setup-dotnet
      if: matrix.sdk-source != 'apt' && steps.cache-build.outputs.cache-hit != 'true'
      with:
        dotnet-version: ${{ steps.get-exact-version.outputs.exact-version }}
        # An empty value means "the runner's own architecture". For x86, setup-dotnet
        # installs into a dedicated <PROGRAMFILES>\dotnet\x86 root and points
        # DOTNET_ROOT/PATH at it, so the x86 and x64 SDKs never share a root.
        architecture: ${{ matrix.sdk-source == 'setup-dotnet-x86' && 'x86' || '' }}

    - name: Checkout
      uses: actions/checkout@v4
      if: steps.cache-build.outputs.cache-hit != 'true'
      with:
        fetch-depth: 0

    # A dotnet host resolves SDKs only from its own install root (there is no
    # multilevel lookup on Linux), so the engineering SDK and the test SDK must
    # live in the SAME root or one of them is invisible. For non-apt jobs both
    # come from setup-dotnet, which installs into a single per-architecture root,
    # so a single setup-dotnet step is enough -- but the `architecture` input must
    # match the step above, otherwise the engineering SDK lands in the x64 root
    # while the test SDK is in the x86 one. For apt jobs the test SDK is in apt's
    # root (/usr/lib/dotnet), so the engineering SDK is installed there too --
    # see the apt-specific step below.
    - name: Install .NET For Engineering
      uses: actions/setup-dotnet@v5
      id: setup-dotnet-eng
      if: matrix.sdk-source != 'apt' && steps.cache-build.outputs.cache-hit != 'true'
      with:
        dotnet-version: 9.0.3xx # Keep in sync with eng\src\global.json.
        architecture: ${{ matrix.sdk-source == 'setup-dotnet-x86' && 'x86' || '' }}

    # apt jobs: install the engineering SDK into apt's dotnet root so that one
    # dotnet host sees both the apt-provided test SDK and the engineering SDK.
    # setup-dotnet cannot target a custom directory, so use dotnet-install.sh.
    - name: Install .NET For Engineering (apt jobs)
      if: matrix.sdk-source == 'apt' && steps.cache-build.outputs.cache-hit != 'true'
      run: |
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
        chmod +x /tmp/dotnet-install.sh
        # 9.0.3xx feature band — keep in sync with eng/src/global.json.
        sudo /tmp/dotnet-install.sh --channel 9.0.3xx --install-dir "$APT_DOTNET_DIR" --no-path
        echo "Engineering SDK installed into $APT_DOTNET_DIR; SDKs now visible:"
        dotnet --list-sdks

    - name: Clean up .NET version
      shell: pwsh
      if: steps.cache-build.outputs.cache-hit != 'true'
      run: |
        $version = "${{ steps.sdk-version.outputs.version }}"
        $cleanedVersion = $version -replace '-servicing.*', ''
        echo "DOTNET_CLEANED_VERSION=$cleanedVersion" >> $env:GITHUB_ENV
        echo "Cleaned version: $cleanedVersion"

    # See resolve-dependencies at the top of this file. The artifacts were already
    # downloaded once for the whole run, so this restore replaces a TeamCity
    # download over the company uplink with a GitHub-local one. The `.completed`
    # sentinel inside the restored tree is what makes PostSharp.Engineering skip
    # the download in the `prepare` step below.
    #
    # A miss is not fatal: `prepare` then falls back to downloading from TeamCity,
    # which is the pre-existing behaviour, just slow.
    - name: Restore dependencies from cache
      id: cache-deps
      if: steps.cache-build.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        # Workspace-relative on purpose -- see the note in resolve-dependencies.
        # An absolute path such as ~/.build-artifacts does not survive a change of
        # operating system: the entry restores, but unpacks into the workspace on
        # Windows, where nothing looks for it.
        path: .deps-cache
        enableCrossOsArchive: true
        key: deps-${{ env.CacheKeyPrefix }}-${{ needs.resolve-dependencies.outputs.deps-id }}

    # Move the staged copy to where PostSharp.Engineering actually looks for it
    # ($USERPROFILE/.build-artifacts). The `.completed` sentinel travels with it,
    # which is what makes the `prepare` step below skip the TeamCity download.
    - name: Unstage dependencies into the artifact location
      if: steps.cache-build.outputs.cache-hit != 'true' && steps.cache-deps.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $target = Join-Path $env:USERPROFILE '.build-artifacts'
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        Copy-Item -Path '.deps-cache/*' -Destination $target -Recurse -Force
        Write-Host "Staged cached dependencies into $target"
        Get-ChildItem -Path $target -Filter '.completed' -Recurse -Force |
          ForEach-Object { Write-Host "  sentinel: $($_.FullName)" }

    - name: Warn on dependency cache miss
      if: steps.cache-build.outputs.cache-hit != 'true' && steps.cache-deps.outputs.cache-hit != 'true'
      shell: pwsh
      run: Write-Host "::warning::Dependency cache miss - the --cached-only step below will fail rather than download from TeamCity."

    # Pin to the build resolved once by resolve-dependencies instead of
    # re-resolving the branch here. This both matches the cache and guarantees the
    # whole matrix tests one single Metalama build: re-resolving per job means a
    # Metalama build finishing mid-run would split the matrix across two versions.
    #
    # --cached-only (PostSharp.Engineering >= 2023.2.400) makes this step FAIL if the
    # artifacts are not already in the local cache, instead of quietly downloading
    # them. That is deliberate: these jobs are only reachable after
    # resolve-dependencies seeded the cache, so a miss means the seeding is broken,
    # and the silent fallback hid exactly that bug twice -- the run went green while
    # every Windows job pulled from TeamCity. Better to fail loudly here.
    # Build numbers are still resolved against TeamCity; only the artifact download
    # is forbidden.
    # Two invocations rather than one: --buildNumber/--buildTypeId describe a single
    # dependency, so each pinned dependency needs its own call.
    - name: Configure the dependency to Metalama
      shell: pwsh
      if: steps.cache-build.outputs.cache-hit != 'true'
      run: |
        ./Build.ps1 dependencies set BuildServer Metalama --buildNumber ${{ needs.resolve-dependencies.outputs.build-number }} --buildTypeId ${{ needs.resolve-dependencies.outputs.build-type-id }} --cached-only --nologo --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./Build.ps1 dependencies set BuildServer Metalama.Premium --buildNumber ${{ needs.resolve-dependencies.outputs.premium-build-number }} --buildTypeId ${{ needs.resolve-dependencies.outputs.premium-build-type-id }} --cached-only --nologo --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install Java
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && steps.cache-build.outputs.cache-hit != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: 17

    - name: Install Android SDK
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && (matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-15' || matrix.os == 'windows-11-vs2026-arm') && steps.cache-build.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@v3
      with:
          cmdline-tools-version: 10406996
  
    - name: Install Android SDK Tools
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && matrix.os == 'macos-15'  && steps.cache-build.outputs.cache-hit != 'true'
      run: sdkmanager "build-tools;32.0.0" "platforms;android-34"

    - name: Download Metalama and create global.json
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./Build.ps1 prepare --sdk-version ${{ env.DOTNET_CLEANED_VERSION }} --nologo --no-progress; type global.json; type nuget.config;

    # ─── Xcode selection — READ THIS BEFORE TOUCHING (this breakage keeps recurring) ───
    #
    # Symptom that reappeared ~10 times:
    #   error : This version of .NET for iOS/MacCatalyst (NN.N.xxxxx) requires
    #           Xcode NN.N. The current version of Xcode is MM.M.
    #
    # The .NET iOS/MacCatalyst workload demands a specific Xcode. We cannot simply
    # take the newest Xcode: setup-xcode can only SELECT an Xcode already baked into
    # the macos-15 runner image, and that image lags Apple by weeks. We also cannot
    # take the newest workload: it routinely needs an Xcode the image does not have
    # yet. The full rationale is on the macOS MAUI version pins in the env block at
    # the top of this file; CLAUDE.md documents how to move the pins forward.
    #
    # So we select the exact Xcode that the PINNED workload set requires. The Xcode
    # and SDK pins are one matched dotnet/macios release and are bumped together.
    # ───────────────────────────────────────────────────────────────────────────────
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && matrix.os == 'macos-15' && steps.cache-build.outputs.cache-hit != 'true'
      with:
        xcode-version: ${{ matrix.dotnet-version == '8.0' && env.MACOS_MAUI_XCODE_8_0 || matrix.dotnet-version == '9.0' && env.MACOS_MAUI_XCODE_9_0 || matrix.dotnet-version == '10.0' && env.MACOS_MAUI_XCODE_10_0 || env.MACOS_MAUI_XCODE_11_0 }}

    - name: Configure Xcode
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && matrix.os == 'macos-15'  && steps.cache-build.outputs.cache-hit != 'true'
      run: |
        sudo xcodebuild -license accept
        sudo xcodebuild -runFirstLaunch
        echo "xcodebuild -version"
        xcodebuild -version
        echo "xcode-select -p"
        xcode-select -p
        echo "xcrun --find actool"
        xcrun --find actool
        echo "xcodebuild -find actool"
        xcodebuild -find actool
        echo "=== Available Simulator Runtimes ==="
        xcrun simctl list runtimes
        echo ""
        echo "=== Xcode Version ==="
        xcodebuild -version
        echo ""
        echo "=== SDK Versions ==="
        xcodebuild -showsdks
        echo ""
        echo "=== Available iOS Simulators ==="
        xcrun simctl list devices available
        echo "Installing iOS simulator runtime..."
        xcodebuild -downloadPlatform iOS || true
        echo "=== Updated Simulator Runtimes ==="
        xcrun simctl list runtimes

    # Workload install for non-apt MAUI jobs. apt jobs use the separate step
    # below because the Canonical apt SDK needs --skip-manifest-update.
    - name: Install .NET Workloads
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && matrix.sdk-source != 'apt' && steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $os = '${{ matrix.os }}'
        if ($os -eq 'windows-latest' -or $os -eq 'windows-11-vs2026-arm') {
          dotnet workload install maui
        } elseif ($os -eq 'macos-15') {
          # macOS builds the iOS + Mac Catalyst TFMs. Pin the workload set to the
          # same Xcode-compatible version as the SDK (see the macOS MAUI version
          # pins in the env block and CLAUDE.md) so it does not resolve to a newer
          # workload that needs an Xcode absent from the runner image. .NET 8 has
          # no band conflict and no documented workload set, so it installs unpinned.
          #
          # For .NET 9/10 the workload set version IS the SDK version, so the SDK
          # pin doubles as the set pin. The .NET 11 previews version the two
          # independently, so that band pins the set explicitly.
          $workloadSet = @{
            '9.0'  = '${{ steps.get-exact-version.outputs.exact-version }}'
            '10.0' = '${{ steps.get-exact-version.outputs.exact-version }}'
            '11.0' = '${{ env.MACOS_MAUI_WORKLOADSET_11_0 }}'
          }['${{ matrix.dotnet-version }}']
          $pinArgs = if ($workloadSet) { @('--version', $workloadSet) } else { @() }
          foreach ($wl in 'maui-android', 'maui-ios', 'maui-maccatalyst') {
            dotnet workload install $wl @pinArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        } else {
          # Linux: maui-android is the only MAUI workload installable here. Its
          # Microsoft.Maui.Templates.netN pack registers the maui / maui-blazor
          # templates, so no separate `dotnet new install` is needed (and it
          # would fail with exit 106, since that pack is already present).
          dotnet workload install maui-android
        }

    # Workload install for apt MAUI jobs.
    #
    # .NET 9/10: the Canonical apt SDK is a fixed patch (e.g. 10.0.107); a plain
    # `dotnet workload install` first auto-updates to the newest workload SET
    # (e.g. 10.0.108), newer than that SDK. The garbage-collection pass that ends
    # every install then resolves the SDK's feature band against the mismatched
    # set, treats the maui-android packs it just installed as unused, and deletes
    # them all -- so the build fails with NETSDK1147. --skip-manifest-update
    # keeps the install on the SDK's own baseline manifests, so install and GC
    # agree and the packs survive (including Microsoft.Maui.Templates.netN, which
    # registers the maui / maui-blazor templates -- so, unlike the non-apt Linux
    # path above, no separate `dotnet new install` is needed).
    #
    # .NET 8: it has no workload set, and the apt 8.0 SDK's baseline manifests do
    # not even define the maui-android workload, so --skip-manifest-update there
    # fails with "Workload ID maui-android is not recognized". .NET 8 must update
    # its manifests; with no workload set there is no set/SDK mismatch, so that
    # plain install's GC is not destructive.
    - name: Install .NET Workloads (apt jobs)
      if: (matrix.project-type == 'maui' || matrix.project-type == 'maui-blazor') && matrix.sdk-source == 'apt' && steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        if ('${{ matrix.dotnet-version }}' -eq '8.0') {
          dotnet workload install maui-android
        } else {
          dotnet workload install maui-android --skip-manifest-update
        }

    - name: Set ref version for Assembly Locator
      shell: pwsh
      if:  steps.cache-build.outputs.cache-hit != 'true'
      run: ./Build.ps1 set-ref-version ${{ steps.sdk-version.outputs.version }} --nologo

    - name: Create project
      shell: pwsh
      if:  steps.cache-build.outputs.cache-hit != 'true'
      run: ./Build.ps1 create-project ${{ matrix.project-type }} --nologo

    # Locate MSBuild.exe via vswhere and put it on PATH. Do NOT hardcode the
    # Visual Studio path: the edition and version on the runner image move.
    #
    # msbuild-architecture selects the MSBuild HOST process architecture:
    #   x86   -> MSBuild\Current\Bin\MSBuild.exe        (32-bit)
    #   x64   -> MSBuild\Current\Bin\amd64\MSBuild.exe  (64-bit)
    #   arm64 -> MSBuild\Current\Bin\arm64\MSBuild.exe
    # The action's own default is x86, so x64 must be asked for explicitly --
    # "VS 2022 is 64-bit" describes what the IDE launches, not what sits at
    # Bin\MSBuild.exe. This is the MSBuild host only; the SDK architecture is a
    # separate matter, chosen by sdk-source.
    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2
      if: startsWith(matrix.build-tool, 'msbuild') && steps.cache-build.outputs.cache-hit != 'true'
      with:
        msbuild-architecture: ${{ matrix.build-tool == 'msbuild-x64' && 'x64' || matrix.build-tool == 'msbuild-arm64' && 'arm64' || 'x86' }}

    # `msbuild -version` reports the PRODUCT version, which is identical for every
    # host architecture and so cannot tell them apart -- msbuild-x64 and msbuild-x86
    # both reported "18.7.8". Read the PE header machine type instead, which is the
    # actual bitness of the binary that setup-msbuild put on PATH.
    #
    # This exists to answer a specific question: Visual Studio 2026 is 64-bit only,
    # so Bin\MSBuild.exe (the path used for msbuild-architecture: x86) may no longer
    # be a 32-bit host. If this prints x64 for the msbuild-x86 job, that matrix value
    # is silently duplicating msbuild-x64 and should be dropped rather than paid for.
    - name: Report MSBuild host architecture
      if: startsWith(matrix.build-tool, 'msbuild') && steps.cache-build.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $path = (Get-Command msbuild).Source
        $stream = [IO.File]::OpenRead($path)
        try {
          $reader = New-Object IO.BinaryReader($stream)
          $stream.Position = 0x3C
          $stream.Position = $reader.ReadInt32() + 4   # PE signature + COFF header
          $machine = $reader.ReadUInt16()
        } finally { $stream.Dispose() }
        $arch = switch ($machine) {
          0x014C  { 'x86' }
          0x8664  { 'x64' }
          0xAA64  { 'arm64' }
          default { '0x{0:X4}' -f $machine }
        }
        Write-Host "::notice::build-tool=${{ matrix.build-tool }} resolved to $path (PE machine type: $arch)"

    - name: Build
      shell: pwsh
      if:  steps.cache-build.outputs.cache-hit != 'true'
      run: |
        cd src/Metalama.Tests.DotNetSdk
        if ('${{ matrix.build-tool }}' -eq 'dotnet') {
          dotnet build -p:WarningsAsErrors=CS8785
        } else {
          # MSBuild.exe is a .NET Framework host and, unlike `dotnet build`, does
          # not restore implicitly -- without -restore the build fails on missing
          # project.assets.json. It still needs a .NET SDK on PATH to build
          # SDK-style projects, which the setup-dotnet steps above provide (and
          # global.json pins), so this exercises a different build host over the
          # same SDK rather than a different SDK.
          msbuild -restore -p:WarningsAsErrors=CS8785
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify Transformations
      shell: pwsh
      if:  steps.cache-build.outputs.cache-hit != 'true'
      run: ./Build.ps1 verify-transformations --nologo

    # ─── Metalama.Patterns / Metalama.Extensions package tests ───────────────────
    #
    # One small program per package under tests/packages, each exercising one obvious
    # feature and returning non-zero if it did not work.
    #
    # These are gated on the PROJECT TYPE, which is a filter over the existing cells
    # rather than a new matrix axis. That is not a compromise: the `console` cells
    # already span all 41 distinct (os, dotnet-version, sdk-source, build-tool)
    # combinations the full matrix contains, so running the package tests there covers
    # every platform exactly once instead of nine times.
    #
    # The Windows-only set (Metalama.Patterns.Wpf, which needs a net*-windows target and
    # UseWPF) rides on the `wpf` cells for the same reason: those 24 cells cover every
    # Windows combination.
    - name: Test packages
      shell: pwsh
      if: matrix.project-type == 'console' && steps.cache-build.outputs.cache-hit != 'true'
      env:
        # Metalama.Extensions.Validation / .CodeFixes and Caching.Backends.Azure / .Redis
        # run VerifyMetalamaLicense at build time. No key is needed here: Backstage's
        # UnattendedLicenseSource grants a Metalama Professional licence to any unattended
        # process, which every CI runner is. This is only an override, for the case where
        # that detection ever stops applying; an unset secret is an empty value and the
        # unattended licence takes over.
        MetalamaLicense: ${{ secrets.METALAMA_LICENSE }}
      run: ./Build.ps1 test-packages tests/packages --build-tool ${{ startsWith(matrix.build-tool, 'msbuild') && 'msbuild' || 'dotnet' }} --target-framework net${{ matrix.dotnet-version }} --nologo

    - name: Test Windows-only packages
      shell: pwsh
      if: matrix.project-type == 'wpf' && steps.cache-build.outputs.cache-hit != 'true'
      env:
        MetalamaLicense: ${{ secrets.METALAMA_LICENSE }}
      run: ./Build.ps1 test-packages tests/packages/Windows --build-tool ${{ startsWith(matrix.build-tool, 'msbuild') && 'msbuild' || 'dotnet' }} --target-framework net${{ matrix.dotnet-version }} --nologo

    # Create build cache marker file
    - name: Mark build cache as successful
      if: steps.cache-build.outputs.cache-hit != 'true'
      run: echo Success > ./.build-cache

    # Save build cache after successful build
    - name: Save build cache
      if: success() && steps.cache-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ./.build-cache
        key: build-${{ env.CacheKeyPrefix }}-${{ matrix.os }}-${{ matrix.sdk-source }}-${{ steps.sdk-version.outputs.version }}-${{ matrix.project-type }}-${{ matrix.build-tool }}

  # Generate test summary after all tests complete
  generate-summary:
    runs-on: ubuntu-24.04
    needs: build  # Wait for all matrix jobs to complete
    if: always()  # Run even if some tests failed
    
    permissions:
      actions: read  # Required to read workflow jobs
      issues: write  # Required to update summary issue
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Generate and post test summary
      uses: actions/github-script@v7
      with:
        script: |
          const branch = context.ref.replace('refs/heads/', '');
          const issueNumber = process.env.SUMMARY_ISSUE_NUMBER;

          // Only the long-lived branches own the summary issue. SUMMARY_ISSUE_NUMBER
          // is a per-branch constant, so a run on a topic branch would overwrite the
          // develop branch's last good full-matrix report with its own partial one --
          // and open failure issues for a matrix that was never meant to be green.
          // Topic-branch runs therefore report to the run summary only.
          const isTrackedBranch = branch.startsWith('develop/') || branch.startsWith('release/');

          console.log(`Branch: ${branch}`);
          console.log(`Issue number: ${issueNumber}`);
          console.log(`Writes to issues: ${isTrackedBranch ? 'yes' : 'no (untracked branch)'}`);
        
          
          // Get current workflow run details
          const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId
          });
          
          // Get all jobs for this workflow run (paginated - API max is 100 per page)
          let allJobs = [];
          let page = 1;
          while (true) {
            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
              page: page
            });
            allJobs = allJobs.concat(jobsData.jobs);
            if (jobsData.jobs.length < 100) break;
            page++;
          }
          console.log(`Fetched ${allJobs.length} jobs across ${page} page(s)`);
          
          // Parse matrix jobs (skip the summary job itself)
          // Job name format: build (os, dotnet-version, project-type, sdk-source, build-tool)
          // Note: Order matches matrix definition order in YAML
          const results = allJobs
            .filter(job => job.name.startsWith('build ('))
            .map(job => {
              const match = job.name.match(/build \(([^,]+), ([^,]+), ([^,]+), ([^,]+), ([^)]+)\)/);
              if (match) {
                // Extract exact version from job steps
                let exactVersion = match[2]; // Default to matrix version
                if (job.steps) {
                  const versionStep = job.steps.find(step =>
                    step.name && step.name.startsWith('Exact Version: ')
                  );
                  if (versionStep) {
                    // Handle both "Exact Version: X.Y.Z" and "Exact Version: X.Y.Z (apt)"
                    const versionMatch = versionStep.name.match(/^Exact Version: ([^\s(]+)/);
                    if (versionMatch) {
                      exactVersion = versionMatch[1];
                    }
                  }
                }

                const projectType = match[3];
                const sdkSource = match[4];
                const buildTool = match[5];
                // Create composite OS identifier that includes sdk-source for apt
                const osDisplay = sdkSource === 'apt' ? `${match[1]} (apt)` : match[1];

                return {
                  os: match[1],
                  osDisplay: osDisplay,
                  dotnetVersion: match[2],
                  projectType: projectType,
                  sdkSource: sdkSource,
                  buildTool: buildTool,
                  // One table per (sdk-source, build-tool) pair. `dotnet` is the
                  // baseline build tool, so it is left implicit to keep the
                  // pre-existing headings unchanged.
                  variant: buildTool === 'dotnet' ? sdkSource : `${sdkSource} + ${buildTool}`,
                  exactVersion: exactVersion,
                  status: job.conclusion,
                  url: job.html_url
                };
              }
              return null;
            }).filter(Boolean);
          
          console.log(`Found ${results.length} test jobs`);

          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const summaryIssueUrl =
            `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber}`;

          // Opens a failure issue, falling back to no labels: the `test-failure`
          // label may not exist in the repository, which fails creation with 422,
          // and a report without labels beats no report.
          const createFailureIssue = async (title, body) => {
            if (!isTrackedBranch) {
              console.log(`ℹ️ Untracked branch '${branch}' - not opening a failure issue. Title would have been: ${title}`);
              return null;
            }
            const create = (labels) => github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              ...(labels ? { labels } : {})
            });
            let created;
            try {
              created = await create(['test-failure']);
            } catch (labelError) {
              console.warn(`⚠️ Could not create the issue with labels (${labelError.message}); retrying without labels.`);
              created = await create(null);
            }
            console.log(`📣 Created failure issue #${created.data.number}: ${created.data.html_url}`);
            return created;
          };

          // ── The matrix never ran ────────────────────────────────────────────
          // This job carries `if: always()`, so it also runs when `build` was
          // SKIPPED -- which is what happens whenever resolve-dependencies fails,
          // since `build` needs it. There are then no `build (...)` jobs to parse.
          //
          // Without this guard that case was the ONLY kind of failure that
          // reported nothing at all: zero parsed cells means zero failed cells, so
          // no failure issue was opened, and the summary issue was overwritten with
          // an empty "Total Jobs: 0" report that destroyed the last good one. Run
          // 31949158055 lost all 232 cells and said nothing. Report it loudly and
          // leave the previous summary intact.
          if (results.length === 0) {
            const blocker = allJobs.find(j =>
              j.name.startsWith('resolve-dependencies') && j.conclusion !== 'success');
            const reason = blocker
              ? `\`${blocker.name}\` ended as \`${blocker.conclusion}\`, so every matrix cell was skipped.`
              : 'No `build (...)` job was found in this run.';

            console.log(`❌ No matrix cell ran. ${reason}`);

            await createFailureIssue(
              `❌ Platform Integration Tests: the matrix never ran on ${branch} (run ${context.runId})`,
              [
                `# ❌ No matrix cell ran on \`${branch}\``,
                '',
                `> **Run:** [${context.runId}](${runUrl})`,
                `> **Branch:** \`${branch}\``,
                `> **Commit:** ${context.sha}`,
                `> **Date:** ${new Date().toISOString()}`,
                `> **Last good summary:** [#${issueNumber}](${summaryIssueUrl}) (left untouched)`,
                '',
                reason,
                '',
                'Nothing was tested on this branch by this run. The summary issue still',
                'shows the results of the previous run.',
                '',
                '## Jobs in this run',
                '',
                '| Job | Status |',
                '|---|---|',
                ...allJobs.map(j => `| ${j.name} | ${j.conclusion || j.status} |`),
                '',
                '---',
                '',
                '*This issue was created automatically by the Platform Integration Tests workflow.*'
              ].join('\n'));

            return;
          }

          // Generate summary statistics
          const totalJobs = results.length;
          const successfulJobs = results.filter(r => r.status === 'success').length;
          const failedJobs = results.filter(r => r.status === 'failure').length;
          const cancelledJobs = results.filter(r => r.status === 'cancelled').length;
          
          // Group results by .NET version -> variant (sdk-source + build-tool) -> project-type -> os
          const versionGroups = {};
          const exactVersionCounts = {};

          results.forEach(result => {
            if (!versionGroups[result.dotnetVersion]) {
              versionGroups[result.dotnetVersion] = {};
            }
            if (!versionGroups[result.dotnetVersion][result.variant]) {
              versionGroups[result.dotnetVersion][result.variant] = {};
            }
            if (!versionGroups[result.dotnetVersion][result.variant][result.projectType]) {
              versionGroups[result.dotnetVersion][result.variant][result.projectType] = {};
            }
            versionGroups[result.dotnetVersion][result.variant][result.projectType][result.os] = result;

            // Tally exact SDK versions per .NET band + variant. Most cells use
            // the latest SDK; some (e.g. macOS MAUI) are pinned to an older one, so
            // the headline is the most common version and deviating cells are annotated.
            if (result.exactVersion) {
              const exactKey = `${result.dotnetVersion}-${result.variant}`;
              if (!exactVersionCounts[exactKey]) {
                exactVersionCounts[exactKey] = {};
              }
              const counts = exactVersionCounts[exactKey];
              counts[result.exactVersion] = (counts[result.exactVersion] || 0) + 1;
            }
          });

          // Pick the most common exact version per .NET band + variant as the headline.
          const exactVersions = {};
          Object.keys(exactVersionCounts).forEach(exactKey => {
            const counts = exactVersionCounts[exactKey];
            exactVersions[exactKey] = Object.keys(counts)
              .sort((a, b) => counts[b] - counts[a])[0];
          });

          // Get unique values for rendering
          const allProjectTypes = [...new Set(results.map(r => r.projectType))].sort();
          // One table per (sdk-source, build-tool) variant, ordered by sdk-source
          // first and build tool second, so the baseline `dotnet` tables keep
          // their historical position at the top. Derived from the results rather
          // than hardcoded, so a new matrix value shows up without editing this.
          const SDK_ORDER = ['setup-dotnet', 'setup-dotnet-x86', 'apt'];
          const TOOL_ORDER = ['dotnet', 'msbuild-x64', 'msbuild-x86', 'msbuild-arm64'];
          const rank = (list, value) => {
            const i = list.indexOf(value);
            return i === -1 ? list.length : i; // unknown values sort last
          };
          const variantMeta = {};
          results.forEach(r => { variantMeta[r.variant] = r; });
          const sdkSources = Object.keys(variantMeta).sort((a, b) =>
            rank(SDK_ORDER, variantMeta[a].sdkSource) - rank(SDK_ORDER, variantMeta[b].sdkSource) ||
            rank(TOOL_ORDER, variantMeta[a].buildTool) - rank(TOOL_ORDER, variantMeta[b].buildTool) ||
            a.localeCompare(b));
          
          // Generate markdown summary
          let markdown = `# 🧪 Platform Integration Tests Summary - ${branch}\n\n`;
          markdown += `**Total Jobs:** ${totalJobs} | **Successful:** ${successfulJobs} | **Failed:** ${failedJobs} | **Cancelled:** ${cancelledJobs}\n\n`;
          
          // Create tables per .NET version (sorted properly)
          Object.keys(versionGroups).sort((a, b) => {
            const parseVersion = (version) => version.split('.').map(part => parseInt(part, 10) || 0);
            const versionA = parseVersion(a);
            const versionB = parseVersion(b);

            for (let i = 0; i < Math.max(versionA.length, versionB.length); i++) {
              const partA = versionA[i] || 0;
              const partB = versionB[i] || 0;
              if (partA !== partB) return partA - partB;
            }
            return 0;
          }).forEach(dotnetVersion => {
            markdown += `## .NET ${dotnetVersion}\n\n`;

            // Create a table for each sdk-source
            sdkSources.forEach(sdkSource => {
              const sdkData = versionGroups[dotnetVersion][sdkSource];
              if (!sdkData) return; // Skip if no data for this sdk-source

              // Get OS list for this sdk-source (only OS that have results)
              const osForSdkSource = [...new Set(
                Object.values(sdkData).flatMap(projectData => Object.keys(projectData))
              )].sort();

              if (osForSdkSource.length === 0) return;

              // Get exact version for this combination
              const exactKey = `${dotnetVersion}-${sdkSource}`;
              const exactVer = exactVersions[exactKey];
              const versionDisplay = exactVer ? ` (${exactVer})` : '';

              markdown += `### ${sdkSource}${versionDisplay}\n\n`;

              // Table header
              markdown += `| Project Type | ${osForSdkSource.join(' | ')} |\n`;
              markdown += `|---|${osForSdkSource.map(() => '---').join('|')}|\n`;

              // Table rows
              allProjectTypes.forEach(projectType => {
                // Check if this project type has any results for this sdk-source
                const projectData = sdkData[projectType];
                if (!projectData) return; // Skip project types with no results

                markdown += `| ${projectType} |`;

                osForSdkSource.forEach(os => {
                  const result = projectData[os];

                  if (result) {
                    const statusIcon = result.status === 'success' ? '✅' :
                                     result.status === 'failure' ? '❌' :
                                     result.status === 'cancelled' ? '⚠️' :
                                     result.status === 'skipped' ? '🚫' : '❓';
                    // Show the SDK version when this cell used a different one than
                    // the table headline (e.g. macOS MAUI jobs pinned to an older SDK).
                    const versionSuffix = result.exactVersion && result.exactVersion !== exactVer
                      ? ` ${result.exactVersion}`
                      : '';
                    markdown += ` [${statusIcon}](${result.url})${versionSuffix} |`;
                  } else {
                    markdown += ` 🚫 |`;
                  }
                });

                markdown += `\n`;
              });

              markdown += `\n`;
            });
          });
          
          // Create the issue body
          const timestamp = new Date().toISOString();

          const issueBody = [
            '<!-- AUTO-GENERATED TEST SUMMARY - DO NOT EDIT MANUALLY -->',
            '# 🤖 Automated Test Results Summary',
            '',
            '> **⚠️ This is a pseudo-issue used for storing automated test summary reports.**',
            '> **This content is automatically generated and updated by GitHub Actions.**',
            `> **Branch:** \`${branch}\``,
            `> **Last Updated:** ${timestamp}`,
            `> **Source Run:** [${context.runId}](${runUrl})`,
            '',
            '---',
            '',
            markdown,
            '',
            '---',
            '',
            `*This summary is automatically updated when the Platform Integration Tests workflow completes on the \`${branch}\` branch.*`
          ].join('\n');
          
          // The report always goes to the run summary, whatever the branch. On an
          // untracked branch that is the only place it appears.
          await core.summary.addRaw(markdown).write();

          // Update the issue
          let summaryError = null;

          if (!isTrackedBranch) {
            console.log(`ℹ️ Untracked branch '${branch}' - leaving issue #${issueNumber} alone. The report is in the run summary.`);
          } else {
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: issueBody
              });

              console.log(`✅ Successfully updated issue #${issueNumber} with latest test summary`);
              console.log(`🔗 View at: https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber}`);

            } catch (error) {
              console.error(`❌ Failed to update issue #${issueNumber}:`, error.message);
              // Remember the error but keep going: a failure report is more useful
              // than no report at all, and it is rethrown at the end of the script.
              summaryError = error;
            }
          }

          // ── Failure report ─────────────────────────────────────────────────
          // In addition to the summary pseudo-issue (which is overwritten on every
          // run), open a NEW issue whenever at least one matrix cell was actually
          // tried and failed. Cells that were excluded from the matrix, skipped or
          // cancelled are NOT failures and must not trigger a report.
          const failedResults = results.filter(r => r.status === 'failure');

          if (failedResults.length === 0) {
            console.log('✅ No failed matrix cells - no failure issue created.');
          } else {
            console.log(`❌ ${failedResults.length} failed matrix cell(s) - creating a failure issue.`);

            const sortedFailures = failedResults.slice().sort((a, b) =>
              a.dotnetVersion.localeCompare(b.dotnetVersion, undefined, { numeric: true }) ||
              a.sdkSource.localeCompare(b.sdkSource) ||
              a.buildTool.localeCompare(b.buildTool) ||
              a.osDisplay.localeCompare(b.osDisplay) ||
              a.projectType.localeCompare(b.projectType));

            const failureBody = [
              `# ❌ ${failedResults.length} failed cell(s) out of ${totalJobs} on \`${branch}\``,
              '',
              `> **Run:** [${context.runId}](${runUrl})`,
              `> **Branch:** \`${branch}\``,
              `> **Commit:** ${context.sha}`,
              `> **Date:** ${timestamp}`,
              `> **Full summary:** [#${issueNumber}](${summaryIssueUrl})`,
              '',
              `**Total:** ${totalJobs} | **Successful:** ${successfulJobs} | **Failed:** ${failedJobs} | **Cancelled:** ${cancelledJobs}`,
              '',
              '## Failed cells',
              '',
              '| OS | .NET | SDK version | SDK source | Build tool | Project type | Job |',
              '|---|---|---|---|---|---|---|',
              ...sortedFailures.map(r =>
                `| ${r.os} | ${r.dotnetVersion} | ${r.exactVersion || 'n/a'} | ${r.sdkSource} | ${r.buildTool} | ${r.projectType} | [logs](${r.url}) |`),
              '',
              '---',
              '',
              '*This issue was created automatically by the Platform Integration Tests workflow.*'
            ].join('\n');

            const failureTitle =
              `❌ Platform Integration Tests: ${failedResults.length} failed cell(s) on ${branch} (run ${context.runId})`;

            try {
              await createFailureIssue(failureTitle, failureBody);
            } catch (error) {
              console.error('❌ Failed to create the failure issue:', error.message);
              throw error;
            }
          }

          if (summaryError) {
            throw summaryError;
          }
