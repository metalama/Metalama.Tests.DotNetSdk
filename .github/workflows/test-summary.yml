name: Test Results Summary

on:
  workflow_run:
    workflows: ["Platform Integration Tests"]
    types:
      - completed

jobs:
  summarize:
    runs-on: ubuntu-latest
    
    permissions:
      actions: read
      contents: read
      issues: write         # If you want to create issues for failures
      
    steps:
    - name: Debug workflow run event
      uses: actions/github-script@v7
      with:
        script: |
          console.log('=== WORKFLOW RUN DEBUG INFO ===');
          console.log('Event name:', context.eventName);
          console.log('Workflow run ID:', context.payload.workflow_run?.id);
          console.log('Workflow run conclusion:', context.payload.workflow_run?.conclusion);
          console.log('Workflow run status:', context.payload.workflow_run?.status);
          console.log('Workflow run head branch:', context.payload.workflow_run?.head_branch);
          console.log('Workflow run name:', context.payload.workflow_run?.name);
          console.log('Repository:', context.repo);
          console.log('Full payload:', JSON.stringify(context.payload, null, 2));
    
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Get workflow run details
      id: workflow-details
      uses: actions/github-script@v7
      with:
        script: |
          const runId = context.payload.workflow_run.id;
          const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: runId
          });
          
          // Get all jobs with pagination to handle 200+ matrix jobs
          let allJobs = [];
          let page = 1;
          let hasMore = true;
          
          while (hasMore) {
            const { data: jobsPage } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,  // Maximum per page
              page: page
            });
            
            allJobs = allJobs.concat(jobsPage.jobs);
            
            // Check if we got fewer jobs than requested, meaning we're on the last page
            hasMore = jobsPage.jobs.length === 100;
            page++;
            
            // Safety check to prevent infinite loops
            if (page > 20) {
              console.log(`Warning: Stopped pagination at page ${page} to prevent infinite loop. Total jobs collected: ${allJobs.length}`);
              break;
            }
          }
          
          console.log(`Collected ${allJobs.length} jobs from ${page - 1} pages`);
          
          // Parse job names to extract matrix information
          const results = allJobs.map(job => {
            // Job name format: "build (ubuntu-latest, 8.0.1xx, console)"
            const match = job.name.match(/build \(([^,]+), ([^,]+), ([^)]+)\)/);
            if (match) {
              // Extract exact version from job steps
              let exactVersion = match[2]; // Default to matrix version
              if (job.steps) {
                // Look for the step with exact version in its name
                const versionStep = job.steps.find(step => 
                  step.name && step.name.startsWith('Exact Version: ')
                );
                if (versionStep) {
                  // Extract version from step name: "Exact Version: 10.0.100-rc.1.25451.107"
                  const versionMatch = versionStep.name.match(/^Exact Version: (.+)$/);
                  if (versionMatch) {
                    exactVersion = versionMatch[1];
                  }
                }
              }
              
              return {
                os: match[1],
                dotnetVersion: match[2], 
                exactVersion: exactVersion, // Add exact version field
                projectType: match[3],
                status: job.conclusion,
                duration: job.steps ? job.steps.reduce((total, step) => {
                  if (step.started_at && step.completed_at) {
                    const start = new Date(step.started_at);
                    const end = new Date(step.completed_at);
                    return total + (end - start);
                  }
                  return total;
                }, 0) : 0,
                url: job.html_url
              };
            }
            return null;
          }).filter(Boolean);
          
          return {
            conclusion: workflowRun.conclusion,
            branch: workflowRun.head_branch,
            results: results,
            totalJobs: results.length,
            successfulJobs: results.filter(r => r.status === 'success').length,
            failedJobs: results.filter(r => r.status === 'failure').length,
            cancelledJobs: results.filter(r => r.status === 'cancelled').length
          };
    
    - name: Generate summary table
      id: generate-summary
      uses: actions/github-script@v7
      env:
        WORKFLOW_DATA: ${{ steps.workflow-details.outputs.result }}
      with:
        script: |
          const data = JSON.parse(process.env.WORKFLOW_DATA);
          const results = data.results;
          
          // Group results by .NET version and collect exact versions
          const versionGroups = {};
          const exactVersions = {}; // Map of dotnetVersion -> exactVersion
          
          results.forEach(result => {
            if (!versionGroups[result.dotnetVersion]) {
              versionGroups[result.dotnetVersion] = {};
            }
            if (!versionGroups[result.dotnetVersion][result.projectType]) {
              versionGroups[result.dotnetVersion][result.projectType] = {};
            }
            versionGroups[result.dotnetVersion][result.projectType][result.os] = result;
            
            // Track exact version for this .NET version (use first encountered exact version)
            if (!exactVersions[result.dotnetVersion] && result.exactVersion) {
              exactVersions[result.dotnetVersion] = result.exactVersion;
            }
          });
          
          // Get all unique operating systems and project types
          const allOS = [...new Set(results.map(r => r.os))].sort();
          const allProjectTypes = [...new Set(results.map(r => r.projectType))].sort();
          
          // Generate markdown
          let markdown = `# 🧪 Platform Integration Tests Summary - ${data.branch}\n\n`;
          markdown += `**Overall Status:** ${data.conclusion === 'success' ? '✅ Success' : data.conclusion === 'failure' ? '❌ Failure' : '⚠️ ' + data.conclusion}\n`;
          markdown += `**Total Jobs:** ${data.totalJobs} | **Successful:** ${data.successfulJobs} | **Failed:** ${data.failedJobs} | **Cancelled:** ${data.cancelledJobs}\n\n`;
          
          // Create one table per .NET version (sorted by version, not alphabetically)
          Object.keys(versionGroups).sort((a, b) => {
            // Parse version strings for proper numeric comparison
            const parseVersion = (version) => {
              const parts = version.split('.').map(part => parseInt(part, 10) || 0);
              return parts;
            };
            
            const versionA = parseVersion(a);
            const versionB = parseVersion(b);
            
            // Compare each part of the version
            for (let i = 0; i < Math.max(versionA.length, versionB.length); i++) {
              const partA = versionA[i] || 0;
              const partB = versionB[i] || 0;
              
              if (partA !== partB) {
                return partA - partB;  // Ascending order
              }
            }
            
            return 0;  // Versions are equal
          }).forEach(dotnetVersion => {
            const exactVer = exactVersions[dotnetVersion];
            const versionDisplay = exactVer && exactVer !== dotnetVersion 
              ? `${dotnetVersion} (${exactVer})` 
              : dotnetVersion;
            markdown += `## .NET ${versionDisplay}\n\n`;
            
            // Table header
            markdown += `| Project Type | ${allOS.join(' | ')} |\n`;
            markdown += `|---|${allOS.map(() => '---').join('|')}|\n`;
            
            // Table rows - one per project type
            allProjectTypes.forEach(projectType => {
              markdown += `| ${projectType} |`;
              
              allOS.forEach(os => {
                const result = versionGroups[dotnetVersion][projectType] && versionGroups[dotnetVersion][projectType][os];
                
                if (result) {
                  const statusIcon = result.status === 'success' ? '✅' : 
                                   result.status === 'failure' ? '❌' : 
                                   result.status === 'cancelled' ? '⚠️' : 
                                   result.status === 'skipped' ? '🚫' : '❓';
                  const statusText = `[${statusIcon}](${result.url})`;
                  markdown += ` ${statusText} |`;
                } else {
                  // No result for this combination (likely excluded or skipped)
                  markdown += ` 🚫 |`;
                }
              });
              
              markdown += `\n`;
            });
            
            markdown += `\n`;
          });
          
          // Add overall summary
          markdown += `## Overall Summary\n\n`;
          
          // Summary by .NET version
          const versionSummary = {};
          results.forEach(r => {
            if (!versionSummary[r.dotnetVersion]) versionSummary[r.dotnetVersion] = { total: 0, success: 0, failure: 0, cancelled: 0, skipped: 0 };
            versionSummary[r.dotnetVersion].total++;
            if (r.status === 'success') versionSummary[r.dotnetVersion].success++;
            if (r.status === 'failure') versionSummary[r.dotnetVersion].failure++;
            if (r.status === 'cancelled') versionSummary[r.dotnetVersion].cancelled++;
            if (r.status === 'skipped') versionSummary[r.dotnetVersion].skipped++;
          });
          
          // Calculate expected total jobs per version (accounting for matrix exclusions)
          const expectedJobsPerVersion = allOS.length * allProjectTypes.length;
          
          markdown += `| .NET Version | Total | ✅ Success | ❌ Failed | ⚠️ Cancelled | 🚫 Skipped | Success Rate |\n`;
          markdown += `|---|---|---|---|---|---|---|\n`;
          Object.entries(versionSummary).forEach(([version, stats]) => {
            // Calculate skipped as difference between expected and actual (excluding explicit skipped status)
            const actualRun = stats.success + stats.failure + stats.cancelled;
            const calculatedSkipped = Math.max(0, expectedJobsPerVersion - actualRun);
            const totalSkipped = stats.skipped + calculatedSkipped;
            
            const rate = actualRun > 0 ? ((stats.success / actualRun) * 100).toFixed(1) : '0.0';
            markdown += `| ${version} | ${stats.total} | ${stats.success} | ${stats.failure} | ${stats.cancelled} | ${totalSkipped} | ${rate}% |\n`;
          });
          
          // Summary by OS
          markdown += `\n| Operating System | Total | ✅ Success | ❌ Failed | ⚠️ Cancelled | 🚫 Skipped | Success Rate |\n`;
          markdown += `|---|---|---|---|---|---|---|\n`;
          const osSummary = {};
          results.forEach(r => {
            if (!osSummary[r.os]) osSummary[r.os] = { total: 0, success: 0, failure: 0, cancelled: 0, skipped: 0 };
            osSummary[r.os].total++;
            if (r.status === 'success') osSummary[r.os].success++;
            if (r.status === 'failure') osSummary[r.os].failure++;
            if (r.status === 'cancelled') osSummary[r.os].cancelled++;
            if (r.status === 'skipped') osSummary[r.os].skipped++;
          });
          
          // Calculate expected total jobs per OS (accounting for matrix exclusions)
          const dotnetVersions = [...new Set(results.map(r => r.dotnetVersion))];
          const expectedJobsPerOS = dotnetVersions.length * allProjectTypes.length;
          
          Object.entries(osSummary).forEach(([os, stats]) => {
            // Calculate skipped as difference between expected and actual (excluding explicit skipped status)
            const actualRun = stats.success + stats.failure + stats.cancelled;
            const calculatedSkipped = Math.max(0, expectedJobsPerOS - actualRun);
            const totalSkipped = stats.skipped + calculatedSkipped;
            
            const rate = actualRun > 0 ? ((stats.success / actualRun) * 100).toFixed(1) : '0.0';
            markdown += `| ${os} | ${stats.total} | ${stats.success} | ${stats.failure} | ${stats.cancelled} | ${totalSkipped} | ${rate}% |\n`;
          });
          
          // Write summary to file instead of output to avoid GitHub Actions limitations
          const fs = require('fs');
          fs.writeFileSync('summary.md', markdown);
          
    - name: Post summary to job summary
      run: |
        cat summary.md >> $GITHUB_STEP_SUMMARY
        
    - name: Post summary as comment (if PR)
      if: github.event.workflow_run.event == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');
          
          // Get PR number from workflow run
          const prNumbers = context.payload.workflow_run.pull_requests.map(pr => pr.number);
          
          for (const prNumber of prNumbers) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: summary
            });
          }

    - name: Update branch summary issue
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');
          
          // Get branch name and determine issue number
          const branch = context.payload.workflow_run.head_branch;
          
          // Branch to issue number mapping
          const branchIssueMap = {
            'develop/2025.1': 3,
            'develop/2026.0': 4
          };
          
          const issueNumber = branchIssueMap[branch];
          
          console.log(`Branch: ${branch}`);
          console.log(`Issue number: ${issueNumber}`);
          
          if (!issueNumber) {
            console.error(`❌ Branch '${branch}' is not configured for test summaries.`);
            console.error(`Supported branches:`);
            Object.entries(branchIssueMap).forEach(([br, num]) => {
              console.error(`  ${br} -> Issue #${num}`);
            });
            throw new Error(`Unsupported branch: ${branch}. Only configured branches can generate test summaries.`);
          }
          
          // Verify token permissions by trying to get the issue first
          try {
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber)
            });
            
            console.log(`✅ Found issue #${issueNumber}: "${issue.title}"`);
          } catch (error) {
            console.error(`❌ Failed to access issue #${issueNumber}:`, error.message);
            console.error(`Please check:
            1. Issue #${issueNumber} exists
            2. GITHUB_TOKEN has 'issues: write' permission
            3. Issue is not in a private repo with insufficient access`);
            throw error;
          }
          
          // Create the updated issue body with clear description
          const timestamp = new Date().toISOString();
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`;
          
          const issueBody = [
            '<!-- AUTO-GENERATED TEST SUMMARY - DO NOT EDIT MANUALLY -->',
            '# 🤖 Automated Test Results Summary',
            '',
            '> **⚠️ This is a pseudo-issue used for storing automated test summary reports.**',
            '> **This content is automatically generated and updated by GitHub Actions.**',
            `> **Branch:** \`${branch}\``,
            `> **Last Updated:** ${timestamp}`,
            `> **Source Run:** [${context.payload.workflow_run.id}](${runUrl})`,
            '',
            '---',
            '',
            summary,
            '',
            '---',
            '',
            `*This summary is automatically updated when the Platform Integration Tests workflow completes on the \`${branch}\` branch.*`
          ].join('\n');

          // Update the issue
          try {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: issueBody
            });
            
            console.log(`✅ Successfully updated issue #${issueNumber} with latest test summary`);
            console.log(`🔗 View at: https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber}`);
            
          } catch (error) {
            console.error(`❌ Failed to update issue #${issueNumber}:`, error.message);
            throw error;
          }